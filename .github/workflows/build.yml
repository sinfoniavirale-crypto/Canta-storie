name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set version code
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Inject debug signing config
        run: |
          python3 - << 'EOF'
          import re
          path = "android/app/build.gradle"
          with open(path) as f:
              content = f.read()

          signing_block = """
          signingConfigs {
              debug {
                  storeFile file('../../debug.keystore')
                  storePassword 'android'
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
              }
          }
          """

          content = content.replace("android {", "android {\n" + signing_block, 1)
          content = re.sub(
              r"buildTypes \{\s*debug \{",
              "buildTypes {\n        debug {\n            signingConfig signingConfigs.debug",
              content
          )

          with open(path, "w") as f:
              f.write(content)
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: canta-storie-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
